<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AI创想家</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media=\'all\'">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ========== 登录页面样式 ========== */

        /* 背景装饰 */
        .login-bg-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-element {
            position: absolute;
            font-size: 3rem;
            opacity: 0.15;
            animation: float 20s infinite ease-in-out;
        }

        .bg-element:nth-child(1) { top: 10%; left: 5%; animation-delay: 0s; }
        .bg-element:nth-child(2) { top: 20%; right: 10%; animation-delay: 2s; }
        .bg-element:nth-child(3) { top: 60%; left: 8%; animation-delay: 4s; }
        .bg-element:nth-child(4) { top: 70%; right: 5%; animation-delay: 6s; }
        .bg-element:nth-child(5) { top: 40%; left: 15%; animation-delay: 8s; }
        .bg-element:nth-child(6) { top: 80%; left: 50%; animation-delay: 10s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }

        /* 主内容区 */
        .login-content {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .logo-icon {
            font-size: 4rem;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .logo-text {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        /* 登录卡片 */
        .login-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: 3rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 480px;
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .card-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary-soft) 100%);
            border-radius: var(--radius-lg);
            font-size: 2rem;
        }

        .card-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .card-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* 表单样式 */
        .login-form {
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1.125rem;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 1rem;
            transition: all 0.2s;
            background: var(--bg);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px var(--primary-soft);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .forgot-password {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .submit-btn:disabled {
            background: var(--text-light);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .submit-btn.loading::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            100% { left: 100%; }
        }

        /* 注册入口 */
        .register-section {
            text-align: center;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .register-text {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .register-link {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary-soft) 100%);
            color: var(--primary);
            text-decoration: none;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .register-link:hover {
            background: white;
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
        }

        /* 注册表单容器（默认隐藏） */
        .register-form-container {
            display: none;
            background: white;
            border-radius: var(--radius-xl);
            padding: 3rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 480px;
            animation: fadeInUp 0.5s ease-out;
        }

        .register-form-container.active {
            display: block;
        }

        .login-form-container.hidden {
            display: none;
        }

        .back-to-login {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .back-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .logo-text {
                font-size: 2.25rem;
            }

            .login-card,
            .register-form-container {
                padding: 2rem 1.5rem;
            }

            .showcase-carousel {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
    <script src="js/main.js"></script><script>(function(){function hideLoading(){var el=document.getElementById('loadingOverlay');if(el)el.style.display='none';}if(document.readyState==='complete'||document.readyState==='interactive'){setTimeout(hideLoading,0);}else{document.addEventListener('DOMContentLoaded',hideLoading);}setTimeout(hideLoading,8000);})();</script>
</head>
<body>

<!-- 加载动画 -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
</div>

<!-- Toast 提示 -->
<div class="toast" id="toast"></div>

<!-- ========== ���录/注册页面 ========== -->
<div class="page login-page" id="loginPage">
    <!-- 背景装饰 -->
    <div class="login-bg-elements">
        <span class="bg-element">📚</span>
        <span class="bg-element">✏️</span>
        <span class="bg-element">🌟</span>
        <span class="bg-element">🎨</span>
        <span class="bg-element">📖</span>
        <span class="bg-element">🎭</span>
    </div>

    <!-- 主内容 -->
    <div class="login-content">
        <div class="login-header">
            <div class="logo-container">
                <div class="logo-icon">🎨</div>
                <span class="logo-text">AI 创想家</span>
            </div>
            <p class="login-subtitle">面向儿童的AI创作教育平台</p>
        </div>

        <!-- 登录表单 -->
        <div class="login-card login-form-container" id="loginFormContainer">
            <div class="card-header">
                <div class="card-icon">🔐</div>
                <div>
                    <h2 class="card-title">账号登录</h2>
                    <p class="card-subtitle">欢迎回来，请登录你的账号</p>
                </div>
            </div>

            <form class="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">用户名 / 手机号</label>
                    <input type="text" class="form-input" id="loginUsername" placeholder="请输入用户名或手机号" required>
                </div>

                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="请输入密码" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>记住我</span>
                    </label>
                    <span class="forgot-password">忘记密码？</span>
                </div>

                <button type="submit" class="submit-btn" id="loginSubmitBtn">
                    🚀 立即登录
                </button>
            </form>

            <!-- 注册入口 -->
            <div class="register-section">
                <p class="register-text">还没有账号？</p>
                <button class="register-link" onclick="showRegisterForm()">
                    ✨ 新用户注册
                </button>
            </div>
        </div>

        <!-- 注册表单 -->
        <div class="register-form-container" id="registerFormContainer">
            <div class="card-header">
                <div class="card-icon">✨</div>
                <div>
                    <h2 class="card-title">注册账号</h2>
                    <p class="card-subtitle">加入AI创想家，开启创作之旅</p>
                </div>
            </div>

            <form class="login-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input type="text" class="form-input" id="regUsername" placeholder="请设置用户名（3-15位字符）" required>
                </div>

                <div class="form-group">
                    <label class="form-label">手机号</label>
                    <input type="tel" class="form-input" id="regPhone" placeholder="请输入手机号" pattern="[0-9]{11}" required>
                </div>

                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-input" id="regPassword" placeholder="请设置密码（6-20位）" required>
                </div>

                <div class="form-group">
                    <label class="form-label">确认密码</label>
                    <input type="password" class="form-input" id="regPasswordConfirm" placeholder="请再次输入密码" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="agreeTerms" required>
                        <span>我已阅读并同意<a href="#" class="forgot-password">《用户协议》</a></span>
                    </label>
                </div>

                <button type="submit" class="submit-btn" id="regSubmitBtn">
                    ✨ 注册账号
                </button>
            </form>

            <div class="back-to-login">
                <span>已有账号？ </span>
                <span class="back-link" onclick="showLoginForm()">返回登录</span>
            </div>
        </div>
    </div>
</div>

<script src="js/main.js"></script>
<script>
    // ========== 表单切换 ==========
    function showRegisterForm() {
        document.getElementById('loginFormContainer').classList.add('hidden');
        document.getElementById('registerFormContainer').classList.add('active');
    }

    function showLoginForm() {
        document.getElementById('registerFormContainer').classList.remove('active');
        document.getElementById('loginFormContainer').classList.remove('hidden');
    }

    // ========== 登录处理 ==========
    function handleLogin(e) {
        e.preventDefault();

        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        const rememberMe = document.getElementById('rememberMe').checked;

        if (!username || !password) {
            showToast('请填写完整信息', 'error');
            return;
        }

        const btn = document.getElementById('loginSubmitBtn');
        btn.disabled = true;
        btn.classList.add('loading');
        btn.textContent = '登录中...';

        // 模拟网络请求（简化验证：允许任意账号密码登录）
        setTimeout(() => {
            // 保存登录状态
            const loginData = {
                username: username,
                loginTime: new Date().toISOString()
            };

            if (rememberMe) {
                localStorage.setItem('currentUser', JSON.stringify(loginData));
            } else {
                sessionStorage.setItem('currentUser', JSON.stringify(loginData));
            }

            showToast('✅ 登录成功！正在跳转...', 'success');

            setTimeout(() => {
                // 跳转到工作台页面
                location.href = 'workspace.html';
            }, 1000);
        }, 1000);
    }

    // ========== 注册处理 ==========
    function handleRegister(e) {
        e.preventDefault();

        const username = document.getElementById('regUsername').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirmPassword = document.getElementById('regPasswordConfirm').value;
        const agreeTerms = document.getElementById('agreeTerms').checked;

        // 验证
        if (!username || !phone || !password || !confirmPassword) {
            showToast('请填写完整信息', 'error');
            return;
        }

        if (!agreeTerms) {
            showToast('请阅读并同意用户协议', 'error');
            return;
        }

        if (username.length < 3 || username.length > 15) {
            showToast('用户名长度为3-15个字符', 'error');
            return;
        }

        if (!/^[0-9]{11}$/.test(phone)) {
            showToast('请输入正确的手机号', 'error');
            return;
        }

        if (password.length < 6 || password.length > 20) {
            showToast('密码长度为6-20位', 'error');
            return;
        }

        if (password !== confirmPassword) {
            showToast('两次密码输入不一致', 'error');
            return;
        }

        const btn = document.getElementById('regSubmitBtn');
        btn.disabled = true;
        btn.classList.add('loading');
        btn.textContent = '注册中...';

        setTimeout(() => {
            const users = JSON.parse(localStorage.getItem('registeredUsers') || '[]');

            if (users.find(u => u.username === username)) {
                showToast('❌ 用户名已存在', 'error');
                btn.disabled = false;
                btn.classList.remove('loading');
                btn.textContent = '✨ 注册账号';
                return;
            }

            if (users.find(u => u.phone === phone)) {
                showToast('❌ 该手机号已注册', 'error');
                btn.disabled = false;
                btn.classList.remove('loading');
                btn.textContent = '✨ 注册账号';
                return;
            }

            users.push({
                username,
                phone,
                password,
                createdAt: new Date().toISOString()
            });
            localStorage.setItem('registeredUsers', JSON.stringify(users));

            showToast('✅ 注册成功！即将跳转到新手教程...', 'success');

            setTimeout(() => {
                location.href = 'onboarding.html';
            }, 1500);
        }, 1500);
    }

    // ========== 页面初始化 ==========
    document.addEventListener('DOMContentLoaded', function() {
        // 检���是否已登录
        const currentUser = localStorage.getItem('currentUser') || sessionStorage.getItem('currentUser');
        if (currentUser) {
            location.href = 'profile.html';
        }

        // 自动聚焦
        document.getElementById('loginUsername').focus();
    });
</script>
</body>
</html>
