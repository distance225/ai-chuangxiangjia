<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - AI创想家</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media=\'all\'">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ========== 个人中心主页样式 ========== */

        /* 顶部导航栏 */
        .profile-top-bar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            color: white;
            border: none;
            padding: 0.625rem 1.25rem;
            border-radius: var(--radius-full);
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-btn:hover {
            transform: translateX(-4px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .profile-title {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 顶部导航菜单 */
        .top-nav {
            display: flex;
            gap: 0.5rem;
        }

        .nav-item {
            padding: 0.625rem 1.25rem;
            border-radius: var(--radius-full);
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.3s;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .nav-item:hover {
            background: var(--primary-soft);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .nav-item.active {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary-soft) 100%);
            color: var(--primary);
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.2);
        }

        /* 主体内容区 */
        .profile-main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
            min-height: calc(100vh - 200px);
        }

        .welcome-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: 3rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            text-align: center;
            margin-bottom: 2rem;
        }

        .welcome-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .welcome-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .welcome-desc {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        /* 功能卡片网格 */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .feature-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            text-decoration: none;
            color: inherit;
            display: block;
            position: relative;
            overflow: hidden;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            transform: scaleX(0);
            transition: transform 0.3s;
        }

        .feature-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
        }

        .feature-card:hover::before {
            transform: scaleX(1);
        }

        .feature-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary-soft) 100%);
            border-radius: var(--radius-lg);
            font-size: 2rem;
        }

        .feature-card:nth-child(2) .feature-icon {
            background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
        }

        .feature-card:nth-child(3) .feature-icon {
            background: linear-gradient(135deg, #DBEAFE 0%, #BFDDFE 100%);
        }

        .feature-card:nth-child(4) .feature-icon {
            background: linear-gradient(135deg, #FCE7F3 0%, #FBCFE8 100%);
        }

        .feature-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.75rem;
        }

        .feature-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .feature-link {
            font-size: 0.9rem;
            color: var(--primary);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .feature-link::after {
            content: '→';
            transition: transform 0.2s;
        }

        .feature-card:hover .feature-link::after {
            transform: translateX(4px);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .profile-top-bar {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }

            .top-nav {
                flex-wrap: wrap;
                justify-content: center;
                width: 100%;
            }

            .nav-item {
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
            }

            .profile-main {
                padding: 1.5rem 1rem;
            }

            .welcome-card {
                padding: 2rem 1.5rem;
            }

            .welcome-title {
                font-size: 1.5rem;
            }

            .features-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <script src="js/main.js"></script><script>(function(){function hideLoading(){var el=document.getElementById('loadingOverlay');if(el)el.style.display='none';}if(document.readyState==='complete'||document.readyState==='interactive'){setTimeout(hideLoading,0);}else{document.addEventListener('DOMContentLoaded',hideLoading);}setTimeout(hideLoading,8000);})();</script>
</head>
<body>

<!-- 加载动画 -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
</div>

<!-- Toast 提示 -->
<div class="toast" id="toast"></div>

<!-- ========== 个人中心主页 ========== -->
<div class="page workspace-page" id="profilePage">
    <!-- 顶部导航栏 -->
    <header class="profile-top-bar">
        <a href="workspace.html" class="back-btn">
            <span class="back-arrow">←</span> 返回
        </a>
        <h1 class="profile-title">个人中心</h1>
        <nav class="top-nav">
            <a href="profile-basic.html" class="nav-item">👤 个人资料</a>
            <a href="profile-subscription.html" class="nav-item">💎 管理订阅</a>
            <a href="profile-parent.html" class="nav-item">🔐 家长模式</a>
            <a href="profile-feedback.html" class="nav-item">💬 意见反馈</a>
        </nav>
    </header>

    <!-- 主体内容 -->
    <main class="profile-main">
        <!-- 欢迎卡片 -->
        <div class="welcome-card">
            <div class="welcome-icon">👋</div>
            <h2 class="welcome-title">欢迎来到个人中心</h2>
            <p class="welcome-desc">管理你的个人信息、订阅计划、家长控制以及提交反馈</p>
        </div>

        <!-- 功能卡片网格 -->
        <div class="features-grid">
            <!-- 个人资料 -->
            <a href="profile-basic.html" class="feature-card">
                <div class="feature-icon">👤</div>
                <h3 class="feature-title">个人资料</h3>
                <p class="feature-desc">管理你的姓名、年级、学校等基本信息</p>
                <span class="feature-link">进入设置</span>
            </a>

            <!-- 管理订阅 -->
            <a href="profile-subscription.html" class="feature-card">
                <div class="feature-icon">💎</div>
                <h3 class="feature-title">管理订阅</h3>
                <p class="feature-desc">查看免费版和会员版，升级解锁全部功能</p>
                <span class="feature-link">查看套餐</span>
            </a>

            <!-- 家长模式 -->
            <a href="profile-parent.html" class="feature-card">
                <div class="feature-icon">🔐</div>
                <h3 class="feature-title">家长模式</h3>
                <p class="feature-desc">设置使用时长限制、消费验证等安全管控</p>
                <span class="feature-link">进入管理</span>
            </a>

            <!-- 意见反馈 -->
            <a href="profile-feedback.html" class="feature-card">
                <div class="feature-icon">💬</div>
                <h3 class="feature-title">意见反馈</h3>
                <p class="feature-desc">提交你的建议和问题，帮助我们改进产品</p>
                <span class="feature-link">提交反馈</span>
            </a>
        </div>
    </main>
</div>

</body>
</html>
