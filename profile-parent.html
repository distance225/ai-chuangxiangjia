<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家长模式 - AI创想家</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media=\'all\'">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 页面顶部导航 */
        .page-nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            color: white;
            border: none;
            padding: 0.625rem 1.25rem;
            border-radius: var(--radius-full);
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-btn:hover {
            transform: translateX(-4px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-tabs {
            display: flex;
            gap: 0.5rem;
            margin-left: auto;
        }

        .nav-tab {
            padding: 0.625rem 1.25rem;
            border-radius: var(--radius-full);
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.3s;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .nav-tab.active {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary-soft) 100%);
            color: var(--primary);
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.2);
        }

        .nav-tab:hover:not(.active) {
            background: var(--primary-soft);
            color: var(--primary);
        }

        /* 主体内容 */
        .main-content {
            max-width: 750px;
            margin: 0 auto;
            padding: 3rem 2rem;
            min-height: calc(100vh - 200px);
        }

        .page-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: 2.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            animation: fadeInUp 0.4s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid var(--border);
        }

        .card-icon {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary-soft) 100%);
            border-radius: var(--radius-lg);
            font-size: 1.75rem;
        }

        .card-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text);
            margin: 0;
        }

        .card-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        /* 介绍区域 */
        .intro-box {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary-soft) 100%);
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            margin-bottom: 2rem;
            color: var(--primary);
            font-size: 0.95rem;
            line-height: 1.7;
            border-left: 4px solid var(--primary);
        }

        /* 密码验证面板 */
        .verify-panel {
            background: var(--bg);
            padding: 2.5rem;
            border-radius: var(--radius-xl);
            text-align: center;
            margin-bottom: 2rem;
        }

        .verify-title {
            font-size: 1.25rem;
            color: var(--text);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        /* 密码输入框组 */
        .password-input-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 0.5rem;
        }

        .pwd-box {
            width: 56px;
            height: 64px;
            text-align: center;
            font-size: 1.75rem;
            font-weight: 700;
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);
            background: white;
            transition: all 0.2s;
            caret-color: var(--primary);
        }

        .pwd-box:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-soft);
        }

        .pwd-box.error {
            border-color: var(--danger);
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .verify-hint {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-top: 1rem;
        }

        .verify-btn {
            display: block;
            width: 100%;
            max-width: 200px;
            margin: 1.5rem auto 0;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            border: none;
            padding: 0.875rem 2rem;
            border-radius: var(--radius-full);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .verify-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        </style>
    <script src="js/main.js"></script>
    <script>
        (function(){
            function hideLoading(){
                var el=document.getElementById('loadingOverlay');
                if(el)el.style.display='none';
            }
            if(document.readyState==='complete'||document.readyState==='interactive'){
                setTimeout(hideLoading,0);
            }else{
                document.addEventListener('DOMContentLoaded',hideLoading);
            }
            setTimeout(hideLoading,8000);
        })();
    </script>
</head>
<body>

<!-- 加载动画 -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
</div>

<!-- Toast 提示 -->
<div class="toast" id="toast"></div>

<!-- ========== 家长模式页面 ========== -->
<div class="page workspace-page">
    <!-- 顶部导航 -->
    <header class="page-nav">
        <a href="profile.html" class="back-btn">
            <span class="back-arrow">←</span> 返回
        </a>
        <h1 class="page-title">家长模式</h1>
        <nav class="nav-tabs">
            <a href="profile-basic.html" class="nav-tab">👤 资料</a>
            <a href="profile-subscription.html" class="nav-tab">💎 订阅</a>
            <a href="profile-feedback.html" class="nav-tab">💬 反馈</a>
        </nav>
    </header>

    <!-- 主体内容 -->
    <main class="main-content">
        <div class="page-card">
            <div class="card-header">
                <div class="card-icon">🔐</div>
                <div>
                    <h2 class="card-title">家长守护</h2>
                    <p class="card-subtitle">为孩子设置安全管控</p>
                </div>
            </div>

            <div class="intro-box">
                <p>家长模式可以设置使用时长限制、消费验证等安全管控功能。请输入家长密码进入管理面板。</p>
            </div>

            <!-- 密码验证 -->
            <div class="verify-panel">
                <h3 class="verify-title">🔐 请输入家长密码</h3>
                <div class="password-input-group">
                    <input type="password" class="pwd-box" maxlength="1" data-index="0">
                    <input type="password" class="pwd-box" maxlength="1" data-index="1">
                    <input type="password" class="pwd-box" maxlength="1" data-index="2">
                    <input type="password" class="pwd-box" maxlength="1" data-index="3">
                </div>
                <p class="verify-hint">请输入4位密码</p>
                <button type="button" class="verify-btn" id="enterBtn">确认进入</button>
            </div>
        </div>
    </main>
</div>

<script src="js/main.js"></script>
<script>
    // 获取所有密码输入框
    function getPasswordBoxes() {
        return document.querySelectorAll('.pwd-box');
    }

    // 获取输入的完整密码
    function getFullPassword() {
        const boxes = getPasswordBoxes();
        return Array.from(boxes).map(box => box.value).join('');
    }

    // 处理密码框输入
    function handlePasswordInput(input, index) {
        const boxes = getPasswordBoxes();
        const value = input.value.replace(/\D/g, '');
        input.value = value;

        if (value && index < 3) {
            boxes[index + 1].focus();
        }

        if (getFullPassword().length === 4) {
            document.getElementById('enterBtn').click();
        }
    }

    // 处理键盘事件
    function handlePasswordKeydown(e, index) {
        const boxes = getPasswordBoxes();

        if (e.key === 'Backspace') {
            if (!boxes[index].value && index > 0) {
                boxes[index - 1].focus();
                boxes[index - 1].value = '';
                e.preventDefault();
            }
        } else if (e.key === 'Enter') {
            document.getElementById('enterBtn').click();
        } else if (e.key === 'ArrowLeft' && index > 0) {
            boxes[index - 1].focus();
        } else if (e.key === 'ArrowRight' && index < 3) {
            boxes[index + 1].focus();
        }
    }

    // 确认进入控制面板
    function enterParentControls() {
        const password = getFullPassword();

        if (password.length !== 4) {
            showToast('请输入完整的4位密码', 'error');
            return;
        }

        // 验证成功，跳转到管控页面
        window.location.href = 'profile-parent-control.html';
    }

    // 页面加载时初始化
    document.addEventListener('DOMContentLoaded', function() {
        const boxes = getPasswordBoxes();

        // 自动聚焦第一个密码输入框
        boxes[0].focus();

        // 为每个密码框绑定事件
        boxes.forEach((box, index) => {
            box.oninput = function() {
                handlePasswordInput(this, index);
            };

            box.onkeydown = function(e) {
                handlePasswordKeydown(e, index);
            };

            box.onfocus = function() {
                this.select();
            };
        });

        // 点击确认按钮
        document.getElementById('enterBtn').onclick = enterParentControls;
    });
</script>
</body>
</html>
